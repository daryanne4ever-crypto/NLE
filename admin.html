<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel da Administradora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        h1 {
            color: #1f2937;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #1f2937;
            color: white;
        }
    </style>
</head>
<body>

<h1>Painel de Desenvolvimento dos Alunos</h1>

<table id="alunosTable">
    <thead>
        <tr>
            <th>Email</th>
            <th>Última Atividade</th>
            <th>Nota</th>
            <th>Progresso</th>
            <th>Atualizado Em</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKtAewnSAuDDf-nqsELGAV0iEkCNjYsxk",
  authDomain: "englishplatform-a9e50.firebaseapp.com",
  projectId: "englishplatform-a9e50",
  storageBucket: "englishplatform-a9e50.firebasestorage.app",
  messagingSenderId: "817476380559",
  appId: "1:817476380559:web:84425a6a9fb81e26d84dfa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const tableBody = document.querySelector("#alunosTable tbody");

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    if (user.email !== "daryanne4.ever@gmail.com") {
        alert("Acesso negado — perfil não é administrador.");
        window.location.href = "index.html";
        return;
    }

    // Puxa os dados dos alunos
    const querySnapshot = await getDocs(collection(db, "alunos"));

    querySnapshot.forEach(docSnap => {
        const data = docSnap.data();

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${data.email || "-"}</td>
            <td>${data.ultimaAtividade || "-"}</td>
            <td>${data.nota || "-"}</td>
            <td>${data.progresso || "-"}</td>
            <td>${data.atualizadoEm ? new Date(data.atualizadoEm.seconds * 1000).toLocaleString() : "-"}</td>
        `;
        tableBody.appendChild(row);
    });
});
</script>

</body>
</html>
