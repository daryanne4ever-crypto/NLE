<!DOCTYPE html>
<html>
<head>
  <title>Painel da Administradora</title>
</head>
<body>
  <h1>Bem-vinda, Administradora 👩‍🏫</h1>
  <p>Você está logada com sucesso.</p>

  <button id="logout">Sair</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKtAewnSAuDDf-nqsELGAV0iEkCNjYsxk",
  authDomain: "englishplatform-a9e50.firebaseapp.com",
  projectId: "englishplatform-a9e50",
  storageBucket: "englishplatform-a9e50.firebasestorage.app",
  messagingSenderId: "817476380559",
  appId: "1:817476380559:web:84425a6a9fb81e26d84dfa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "index.html";
  }
});

document.getElementById("logout").addEventListener("click", () => {
  signOut(auth).then(() => {
    localStorage.removeItem('english_lab_session');
    window.location.href = "index.html";
  });
});
</script>

</body>
</html>
